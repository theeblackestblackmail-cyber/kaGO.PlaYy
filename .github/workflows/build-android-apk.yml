name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install dependencies, lint, and build web bundle
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run lint
          npm run build

      - name: Initialize Capacitor Android project and native media layer
        run: |
          npm install --no-save --legacy-peer-deps --no-audit --no-fund @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          node scripts/setup-android-native.mjs

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaGO-PIaY-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
